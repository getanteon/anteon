name: Release Ddosify

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # keyless cosign signing and attestations
      attestations: write # artifact attestations
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ddosify_engine/go.mod
          cache-dependency-path: ddosify_engine/go.sum

      - name: Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Docker Hub Login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The repository also holds selfhosted-* tags, which are not the engine's
      - name: Previous engine tag
        id: previous
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^")" >> "$GITHUB_OUTPUT"

      # Builds the licence, completions and man pages with go run, before any token is in reach
      - name: Release assets
        working-directory: ddosify_engine
        run: scripts/release-assets.sh

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          workdir: ddosify_engine
          args: release --clean
        env:
          # the job's token creates the release; the PAT only pushes the formula to the tap
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}

      # Also when a later publisher (the Homebrew tap) failed: the release and the images are out by then,
      # and an unattested published artefact is worse than a failed formula push (v2.0.0, v2.1.0).
      - name: Attest the archives and SBOMs
        if: ${{ !cancelled() && hashFiles('ddosify_engine/dist/checksums.txt') != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ddosify_engine/dist/checksums.txt

      - name: Attest the images
        if: ${{ !cancelled() && hashFiles('ddosify_engine/dist/digests.txt') != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ddosify_engine/dist/digests.txt
