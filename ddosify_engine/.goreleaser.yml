version: 2

project_name: ddosify
before:
  hooks:
    - go mod verify
    - rm -rf build
    - mkdir -p build/completions build/manpages
    - sh -c "go run . completion bash > build/completions/ddosify.bash"
    - sh -c "go run . completion zsh > build/completions/_ddosify"
    - sh -c "go run . completion fish > build/completions/ddosify.fish"
    - go run . docs man --dir build/manpages
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    goarm:
      - 6
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.GitVersion={{ .Tag }} -X main.GitCommit={{ .ShortCommit }} -X main.BuildDate={{ .CommitDate }}
    ignore:
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
archives:
  - format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - src: ../LICENSE
        dst: LICENSE
      - build/completions/*
      - build/manpages/*
    builds_info:
      mtime: "{{ .CommitDate }}"

# Syft SBOMs of every archive
sboms:
  - artifacts: archive

universal_binaries:
- replace: true

checksum:
  name_template: 'checksums.txt'

# Keyless cosign signature of the checksum file, which lists every archive and SBOM
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
snapshot:
  version_template: "{{ incpatch .Tag }}-next"
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - Merge pull request
      - Merge branch
      - go mod tidy

brews:
  - repository:
      owner: getanteon
      name: homebrew-tap
    directory: Formula
    homepage:  https://ddosify.com
    description: High-performance load testing tool, written in Golang.
    license: AGPL-3.0-only
    skip_upload: false
    test: |
      system "#{bin}/ddosify --help"
    dependencies:
    - name: go
      type: optional
    install: |-
      bin.install "ddosify"
      bash_completion.install "build/completions/ddosify.bash" => "ddosify"
      zsh_completion.install "build/completions/_ddosify"
      fish_completion.install "build/completions/ddosify.fish"
      man1.install Dir["build/manpages/*.1"]
    commit_author:
      name: ddosifyadmin
      email: admin@ddosify.com

dockers_v2:
  - images:
      - "ddosify/ddosify"
    tags:
      - "{{ .Tag }}"
      - latest
    dockerfile: Dockerfile.release
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.licenses: AGPL-3.0-only

# Keyless cosign signature of the pushed images
docker_signs:
  - cmd: cosign
    output: true
    args:
      - "sign"
      - "${artifact}"
      - "--yes"

# dist/digests.txt, for the attestation step of the release workflow
docker_digest:
  name_template: digests.txt

nfpms:
  - file_name_template: '{{ .ProjectName }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    id: packages
    homepage:  https://ddosify.com
    description: High-performance load testing tool, written in Golang.
    maintainer: Ddosify <admin@ddosify.com>
    license: AGPL-3.0-only
    vendor: Ddosify
    formats:
    - apk
    - deb
    - rpm
    contents:
      - src: build/completions/ddosify.bash
        dst: /usr/share/bash-completion/completions/ddosify
      - src: build/completions/_ddosify
        dst: /usr/share/zsh/vendor-completions/_ddosify
      - src: build/completions/ddosify.fish
        dst: /usr/share/fish/vendor_completions.d/ddosify.fish
      - src: build/manpages/*.1
        dst: /usr/share/man/man1/

release:
  footer: |
    ## More? 🚀

    - Join our [Discord server](https://discord.com/invite/9KdnrSUZQg)
    - Follow us on [Twitter](https://twitter.com/getanteon)
